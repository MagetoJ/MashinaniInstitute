[options]
; DB credentials come from the HOST/USER/PASSWORD environment variables set in docker-compose.yml
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Master password for the database manager. Local dev only: change it.
admin_passwd = change-me-master-password
list_db = True
workers = 0
log_level = info
